name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # base_path is "/<repo>" on github.io and "" once a custom domain is set,
      # so links work in both places without changing anything here.
      - run: npm run build
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
      - run: npm run check
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
      # Previews: each branch listed in PREVIEW_BRANCHES is also built into /preview/<branch>/,
      # so it can be looked at on the real site before it is merged. A preview that fails to
      # build is skipped with a warning; it never stops the main site deploying. Pushing to a
      # preview branch doesn't redeploy by itself: run this workflow afterwards (Actions tab →
      # Deploy to GitHub Pages → Run workflow, or `gh workflow run deploy.yml`).
      - name: Build branch previews
        env:
          BASE: ${{ steps.pages.outputs.base_path }}
          PREVIEW_BRANCHES: stock-photos tabler-icons
        run: |
          for b in $PREVIEW_BRANCHES; do
            dir="$RUNNER_TEMP/preview-$b"
            if git fetch --depth 1 origin "refs/heads/$b:refs/remotes/origin/$b" \
              && git worktree add --detach "$dir" "origin/$b" \
              && (cd "$dir" && npm ci && PATH_PREFIX="$BASE/preview/$b/" npm run build && PATH_PREFIX="$BASE/preview/$b/" npm run check); then
              mkdir -p "_site/preview/$b"
              cp -r "$dir/_site/." "_site/preview/$b/"
              echo "Preview of $b: ${{ steps.pages.outputs.base_url }}/preview/$b/" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::The preview of branch $b did not build; skipping it."
            fi
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
