name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # base_path is "/<repo>" on github.io and "" once a custom domain is set,
      # so links work in both places without changing anything here.
      - run: npm run build
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
      - run: npm run check
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
      # Previews: each branch listed in PREVIEW_BRANCHES (branch name, then the label the
      # version picker shows) is also built into /preview/<branch>/, so it can be looked at on
      # the real site before it is merged, and every page gets a picker to switch between them
      # (.github/previews/). A preview that fails to build is skipped with a warning; it never
      # stops the main site deploying. Pushing to a preview branch doesn't redeploy by itself:
      # run this workflow afterwards (Actions tab → Deploy to GitHub Pages → Run workflow, or
      # `gh workflow run deploy.yml`).
      - name: Build branch previews
        env:
          BASE: ${{ steps.pages.outputs.base_path }}
          PREVIEW_BRANCHES: |
            stock-photos Stock photos
            tabler-icons Icons
        run: .github/previews/build-previews.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
