name: Keep member sign-in awake

# Supabase pauses free projects after a week without activity, which would stop
# members signing in on /members/. This reads one row twice a week to keep the
# project active. It does nothing until site.json has the Supabase settings.
on:
  schedule:
    - cron: '17 14 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the keepalive row
        run: |
          url=$(jq -r '.members.supabaseUrl // ""' src/_data/site.json)
          key=$(jq -r '.members.supabaseKey // ""' src/_data/site.json)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "Member directory isn't set up in site.json; nothing to do."
            exit 0
          fi
          curl -fsS "$url/rest/v1/keepalive?select=id&limit=1" -H "apikey: $key"
